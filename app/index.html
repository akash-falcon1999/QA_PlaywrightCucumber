<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WealthRamp - SIP Planner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--a:#22d3ee;--b:#a78bfa}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
h1{font-size:20px;margin:0}h1 span{color:var(--a)}nav{display:flex;gap:8px}
nav button{background:none;border:1px solid #334155;color:var(--mut);padding:8px 16px;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--a);color:#0f172a;border-color:var(--a)}
main{max-width:1000px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border-radius:12px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:var(--tx)}
.kpi{font-size:24px;font-weight:700;color:var(--a)}.err{color:#f87171;font-size:12px;min-height:16px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:right;border-bottom:1px solid #334155}th:first-child,td:first-child{text-align:left}
.charts{display:grid;grid-template-columns:1fr 2fr;gap:16px}@media(max-width:700px){.charts{grid-template-columns:1fr}}
[hidden]{display:none!important}.bar:hover{opacity:.7}
</style></head><body>
<header><h1>Wealth<span>Ramp</span> · SIP Planner</h1>
<nav role="tablist"><button role="tab" id="tab-dashboard" aria-selected="true">Dashboard</button><button role="tab" id="tab-report" aria-selected="false">Yearly Report</button></nav></header>
<main>
<section id="view-dashboard" aria-label="Dashboard">
 <form class="card grid" onsubmit="return false" aria-label="SIP inputs">
  <div><label for="monthly">Monthly SIP (₹)</label><input id="monthly" type="number" value="10000"><div class="err" data-testid="err-monthly"></div></div>
  <div><label for="rate">Expected return (% p.a.)</label><input id="rate" type="number" step="0.1" value="12"><div class="err" data-testid="err-rate"></div></div>
  <div><label for="years">Investment period (years)</label><input id="years" type="number" value="10"><div class="err" data-testid="err-years"></div></div>
  <div><label for="stepup">Annual step-up (%)</label><input id="stepup" type="number" value="0"><div class="err" data-testid="err-stepup"></div></div>
 </form>
 <div class="grid" style="margin-top:16px">
  <div class="card"><label>Total invested</label><div class="kpi" data-testid="kpi-invested"></div></div>
  <div class="card"><label>Estimated returns</label><div class="kpi" data-testid="kpi-returns"></div></div>
  <div class="card"><label>Maturity value</label><div class="kpi" data-testid="kpi-maturity"></div></div>
 </div>
 <div class="charts" style="margin-top:16px">
  <div class="card"><label>Invested vs Returns</label><svg id="donut" role="img" aria-label="Invested vs returns donut" viewBox="0 0 120 120" width="100%"></svg></div>
  <div class="card"><label>Corpus growth by year</label><svg id="bars" role="img" aria-label="Corpus growth bar chart" viewBox="0 0 600 220" width="100%"></svg></div>
 </div>
</section>
<section id="view-report" aria-label="Yearly report" hidden>
 <div class="card"><label for="filter">Show</label><select id="filter"><option value="all">All years</option><option value="5">First 5 years</option><option value="last5">Last 5 years</option></select>
 <table aria-label="Yearly breakdown"><thead><tr><th>Year</th><th>Invested</th><th>Returns</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id), inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const rules={monthly:[500,1e6,'Enter 500 to 1,000,000'],rate:[1,30,'Enter 1 to 30'],years:[1,40,'Enter 1 to 40'],stepup:[0,50,'Enter 0 to 50']};
function simulate(p,r,y,s){const i=r/1200;let bal=0,inv=0,sip=p;const rows=[];
 for(let yr=1;yr<=y;yr++){const startInv=inv,startBal=bal;for(let m=0;m<12;m++){bal=(bal+sip)*(1+i);inv+=sip}
  rows.push({year:yr,invested:inv,returns:bal-inv,balance:bal});sip=sip*(1+s/100)}return rows}
function valid(){let ok=true;for(const k in rules){const v=$(k).value,[lo,hi,msg]=rules[k],bad=v===''||isNaN(v)||+v<lo||+v>hi;
 document.querySelector(`[data-testid=err-${k}]`).textContent=bad?msg:'';ok=ok&&!bad}return ok}
function render(){if(!valid())return;const rows=simulate(+$('monthly').value,+$('rate').value,+$('years').value,+$('stepup').value),L=rows.at(-1);
 document.querySelector('[data-testid=kpi-invested]').textContent=inr(L.invested);
 document.querySelector('[data-testid=kpi-returns]').textContent=inr(L.returns);
 document.querySelector('[data-testid=kpi-maturity]').textContent=inr(L.balance);
 const C=2*Math.PI*40,f=L.invested/L.balance;
 $('donut').innerHTML=`<circle data-testid="slice-returns" data-value="${Math.round(L.returns)}" cx="60" cy="60" r="40" fill="none" stroke="#a78bfa" stroke-width="20"><title>Returns ${inr(L.returns)}</title></circle>
 <circle data-testid="slice-invested" data-value="${Math.round(L.invested)}" cx="60" cy="60" r="40" fill="none" stroke="#22d3ee" stroke-width="20" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 60 60)"><title>Invested ${inr(L.invested)}</title></circle>`;
 const w=580/rows.length,mx=L.balance;
 $('bars').innerHTML=rows.map((r,k)=>{const h=r.balance/mx*190;return `<rect class="bar" data-testid="bar" data-year="${r.year}" data-balance="${Math.round(r.balance)}" x="${10+k*w}" y="${210-h}" width="${w*0.7}" height="${h}" fill="#22d3ee"><title>Year ${r.year}: ${inr(r.balance)}</title></rect>`}).join('');
 const fl=$('filter').value,sel=fl==='5'?rows.slice(0,5):fl==='last5'?rows.slice(-5):rows;
 $('rows').innerHTML=sel.map(r=>`<tr><td>${r.year}</td><td>${inr(r.invested)}</td><td>${inr(r.returns)}</td><td>${inr(r.balance)}</td></tr>`).join('')}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));
['dashboard','report'].forEach(t=>$('tab-'+t).addEventListener('click',()=>{['dashboard','report'].forEach(o=>{$('tab-'+o).setAttribute('aria-selected',o===t);$('view-'+o).hidden=o!==t})}));
render();
</script></body></html>
